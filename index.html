const partsOf=(d,opts,loc='en-u-nu-latn')=>Object.fromEntries(new Intl.DateTimeFormat(loc,{timeZone:TZ,...opts}).formatToParts(d).map(p=>[p.type,p.value]));
function dubaiYMD(d=new Date()){const p=partsOf(d,{year:'numeric',month:'2-digit',day:'2-digit'});return `${p.year}-${p.month}-${p.day}`}
const dayNum=(ymd)=>{const [y,m,d]=ymd.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/86400000)};
function daysUntil(ymd){return dayNum(ymd)-dayNum(dubaiYMD())}
function fmtDate(x,opts){if(!x)return'—';const d=typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?new Date(x+'T12:00:00+04:00'):new Date(x);if(isNaN(d))return esc(x);

function fmtMonth(ym){const [y,m]=ym.split('-').map(Number);return new Intl.DateTimeFormat(state.lang==='ar'?'ar-AE-u-nu-latn':'en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,15)))}

 const d=daysUntil(item.date);
 if(d<0)return {html:`<span class="cd muted">${esc(T.passed)}</span>`,passed:true};
 if(d===0)return {html:`<span class="cd red" role="status">${esc(T.today)} · ${esc(fmtDate(item.date,{day:'numeric',month:'short'}))}</span>`,red:true};

 (rows?(rows.length?`<div class="tablewrap"><table><thead><tr><th>${esc(T.company)}</th><th class="num">${esc(T.price)}</th><th class="num">${esc(T.chg)}</th><th class="num">${esc(T.turnover)}</th><th>${esc(T.time)}</th></tr></thead><tbody>${rows.map(s=>{const ch=typeof s.change_pct==='number'?s.change_pct:null;return `<tr><td><bdi>${esc(L(s,'name'))}</bdi><br><small class="num" style="color:var(--fg2)">${esc(s.symbol)} · ${esc(s.exchange)}</small></td><td class="num">${typeof s.price==='number'?s.price.toFixed(2):'—'}</td><td class="num ${ch==null?'':ch>=0?'up':'down'}">${ch==null?'—':`${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(2)}%`}</td><td class="num">${typeof s.turnover_aed==='number'?s.turnover_aed.toLocaleString('en',{maximumFractionDigits:0}):'—'}</td><td><small><bdi>${esc(fmtDate(s.as_of,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</bdi> · <span class="chip ${s.status==='stale'?'exp':'info'}">${esc(T.dtype[s.status]||s.status||'')}</span></small></td></tr>`}).join('')}</tbody></table></div>`:empty()):skeleton(7));
 el.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{state.stockFilter=b.dataset.f;renderMarkets()}))}
function renderAll(){renderDate();renderStrip();renderNews();renderScience();renderWatch();renderRank();renderRadar();renderGadgets();renderEvents();renderStatus();renderMarkets();$('#foot').textContent=t().footer;$('#banner').classList.toggle('show',!navigator.onLine);if(!navigator.onLine)$('#banner').textContent=t().offline;
 document.title=state.lang==='ar'?'لوحتي اليومية · Daily Desk':'Daily Desk · لوحتي اليومية'}
/* ========== modals ========== */
function openModal(title,html,opener){state.opener=opener||document.activeElement;$('#mTitle').textContent=title;$('#mBody').innerHTML=html;$('#modal').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('#mClose').focus(),0)}
function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow='';if(state.opener&&state.opener.focus)state.opener.focus()}
$('#mClose').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal()});
const AR_DIG=/[٠-٩۰-۹]/g;const toNum=(s)=>{s=String(s).replace(AR_DIG,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)>=0?'٠١٢٣٤٥٦٧٨٩'.indexOf(d):'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٬,]/g,'').replace('٫','.');const n=parseFloat(s);return isFinite(n)?n:0};
function modalGold(op){const T=t();const g=state.feeds.gold_fx&&state.feeds.gold_fx.gold;if(!g||typeof g.usd_per_oz!=='number'){openModal(T.goldTitle,`<div class="empty">${esc(T.unavailable)}</div>`,op);return}
 const usdAed=(state.feeds.gold_fx.fx&&state.feeds.gold_fx.fx.usd_aed)||3.6725;const perG=g.usd_per_oz/31.1034768*usdAed;const K={24:.999,22:.9166,21:.875,18:.75};
 openModal(T.goldTitle,`<div class="big" style="color:var(--gold)">$${g.usd_per_oz.toLocaleString('en',{maximumFractionDigits:2})} <small style="font-size:.5em;color:var(--fg2)">/ ${esc(T.oz)}</small></div>
 <h4 style="margin:.8rem 0 .3rem">${esc(T.gram)}</h4><div class="cards cols3">${Object.entries(K).map(([k,p])=>`<div class="card" style="text-align:center"><div class="fine">${esc(T.karat)} ${k}</div><div class="score" style="color:var(--gold)">${(perG*p).toFixed(2)}</div><div class="fine">AED / g</div></div>`).join('')}</div>
 <dl class="kv" style="margin-top:.8rem"><dt>${esc(T.provider)}</dt><dd><bdi>${esc(g.provider||'—')}</bdi></dd><dt>${esc(T.updated)}</dt><dd><bdi>${esc(fmtDate(g.as_of,{dateStyle:'medium',timeStyle:'short'}))}</bdi></dd><dt>${esc(T.session)}</dt><dd><span class="chip ${g.status==='live'?'ok':'info'}">${esc(T.dtype[g.status]||g.status||'')}</span></dd><dt>USD/AED</dt><dd class="num">${usdAed}</dd></dl><p class="fine">${esc(T.goldNote)}</p>`,op)}
function modalFx(cur,op){const T=t();const fx=state.feeds.gold_fx&&state.feeds.gold_fx.fx;if(!fx||!fx.rates||typeof fx.rates[cur]!=='number'){openModal(T.fxTitle,`<div class="empty">${esc(T.unavailable)}</div>`,op);return}
 let dir=0;const r=fx.rates[cur];
 openModal(T.fxTitle+' · '+cur,`<div class="field"><label for="fxAmt">${esc(T.amount)} (<span id="fxFrom">AED</span>)</label><input id="fxAmt" inputmode="decimal" value="1000" dir="ltr"></div>
 <button class="btn ghost" id="fxSwap" style="width:100%">⇄ ${esc(T.swap)}</button><div class="big" style="margin:.6rem 0" id="fxOut"></div>
 <dl class="kv"><dt>1 AED</dt><dd class="num">${r.toLocaleString('en',{maximumFractionDigits:4})} ${cur}</dd><dt>1 ${cur}</dt><dd class="num">${(1/r).toLocaleString('en',{maximumFractionDigits:4})} AED</dd><dt>${esc(T.rateDate)}</dt><dd><bdi>${esc(fmtDate(fx.as_of,{dateStyle:'medium'}))}</bdi></dd><dt>${esc(T.provider)}</dt><dd><bdi>${esc(fx.provider||'—')}</bdi></dd></dl><p class="fine">${esc(T.fxNote)}</p>`,op);
 const calc=()=>{const a=toNum($('#fxAmt').value);const v=dir===0?a*r:a/r;$('#fxOut').innerHTML=`${v.toLocaleString('en',{maximumFractionDigits:2})} <small style="font-size:.5em;color:var(--fg2)">${dir===0?cur:'AED'}</small>`};
 $('#fxAmt').addEventListener('input',calc);$('#fxSwap').addEventListener('click',()=>{dir=1-dir;$('#fxFrom').textContent=dir===0?'AED':cur;calc()});calc()}
function modalWx(op){const T=t();const w=state.feeds.weather;if(!w||!w.daily){openModal(T.wxTitle,`<div class="empty">${esc(T.unavailable)}</div>`,op);return}const c=w.current||{};
 openModal(T.wxTitle+' · '+T.dubai,`<dl class="kv"><dt>${esc(T.feels)}</dt><dd class="num">${typeof c.feels_c==='number'?Math.round(c.feels_c)+'°':'—'}</dd><dt>${esc(T.humidity)}</dt><dd class="num">${typeof c.humidity==='number'?c.humidity+'%':'—'}</dd><dt>${esc(T.sunrise)} / ${esc(T.sunset)}</dt><dd class="num">${esc(hm(w.sunrise))} / ${esc(hm(w.sunset))}</dd></dl>
 <div class="wx10" style="margin-top:.6rem">${w.daily.slice(0,10).map(d=>`<div class="d"><bdi>${esc(fmtDate(d.date,{weekday:'short',day:'numeric',month:'short'}))}</bdi>${wxIcon(d.code)}<span>${esc(L(d,'desc'))}${typeof d.rain_pct==='number'?` · ${esc(T.rain)} ${d.rain_pct}%`:''}</span><span class="num"><b>${typeof d.max_c==='number'?Math.round(d.max_c)+'°':'—'}</b> / ${typeof d.min_c==='number'?Math.round(d.min_c)+'°':'—'}</span></div>`).join('')}</div>
 <p class="fine" style="margin-top:.6rem">${esc(T.provider)}: <bdi>${esc(w.provider||'—')}</bdi> · ${esc(T.updated)}: <bdi>${esc(fmtDate(w.as_of,{dateStyle:'medium',timeStyle:'short'}))}</bdi></p>`,op)}
function modalIos(op){const T=t();const ios=state.feeds.ios;if(!ios){openModal(T.iosTitle,`<div class="empty">${esc(T.unavailable)}</div>`,op);return}
 const cdn=countdown({date:ios.next_date,date_precision:ios.next_date_precision,status:'official'});const cdf=countdown({date:ios.fold_date,date_precision:ios.fold_date_precision,status:ios.fold_status_key||'expected'});
 openModal(T.iosTitle,`<dl class="kv"><dt>${esc(T.stable)}</dt><dd class="num">iOS ${esc(ios.stable_version||'—')} · ${esc(fmtDate(ios.stable_released,{day:'numeric',month:'short',year:'numeric'}))}</dd>
 <dt>${esc(T.nextUpd)}</dt><dd><bdi class="num">${esc(ios.next_version||'—')}</bdi> <span class="chip info">${esc(T.stage[ios.next_stage]||'')}</span> ${cdn.html}</dd>
 <dt>${esc(T.fold)}</dt><dd>${esc(L(ios,'fold_status'))} ${ios.fold_event_type?`<span class="chip">${esc(T.evt[ios.fold_event_type]||'')}</span>`:''} ${cdf.html}</dd></dl>
 <h4 style="margin:.8rem 0 .3rem">${esc(T.evidence)}</h4><ul style="margin:0;padding-inline-start:1.2rem">${(ios.evidence||[]).map(e=>`<li>${link(e.url,esc(L(e,'label')))}</li>`).join('')}</ul>
 <p class="fine">${esc(T.verified)}: <bdi>${esc(fmtDate(ios.verified_at,{dateStyle:'medium',timeStyle:'short'}))}</bdi></p><button class="btn ghost" id="verifyNow">${esc(T.verifyNow)}</button>`,op);
 $('#verifyNow').addEventListener('click',async()=>{await refresh(true);modalIos(state.opener)})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-modal]');if(!b)return;const k=b.dataset.modal;if(k==='gold')modalGold(b);else if(k==='fx')modalFx(b.dataset.cur,b);else if(k==='wx')modalWx(b);else if(k==='ios')modalIos(b)});
/* ========== preferences ========== */
function applyPrefs(){const root=document.documentElement;root.lang=state.lang;root.dir=state.lang==='ar'?'rtl':'ltr';root.dataset.size=state.size;if(state.theme)root.dataset.theme=state.theme;else root.removeAttribute('data-theme');
 $('#langLbl').textContent=state.lang==='ar'?'EN':'AR';const T=t();$('#btnLang').title=T.lang;$('#btnSize').title=`${T.size}: ${T.sizes[state.size]}`;$('#btnTheme').title=T.dark;$('#btnRefresh').title=T.refresh;
 const dark=state.theme==='dark'||(!state.theme&&matchMedia('(prefers-color-scheme: dark)').matches);$('#btnTheme').setAttribute('aria-pressed',String(dark))}
$('#btnLang').addEventListener('click',()=>{state.lang=state.lang==='ar'?'en':'ar';ls.set('dd.lang',state.lang);applyPrefs();renderAll()});
$('#btnSize').addEventListener('click',()=>{const o=['normal','large','larger','xl'];state.size=o[(o.indexOf(state.size)+1)%4];ls.set('dd.size',state.size);applyPrefs()});
$('#btnTheme').addEventListener('click',()=>{const dark=$('#btnTheme').getAttribute('aria-pressed')==='true';state.theme=dark?'light':'dark';ls.set('dd.theme',state.theme);applyPrefs()});
$('#btnRefresh').addEventListener('click',()=>refresh(true));
/* ========== data ========== */
const FEEDS=['news','science','watchlist','announcements','rankings','gadgets','radar','device_news','events','ios','markets','gold_fx','weather','jobs'];
function loadBackup(){try{const raw=localStorage.getItem('dd.backup');if(!raw)return;const b=JSON.parse(raw);if(b&&b.feeds){state.feeds=b.feeds;state.fromBackup=true}}catch(e){}}
function saveBackup(){ls.set('dd.backup',JSON.stringify({saved_at:new Date().toISOString(),feeds:state.feeds}))}
let refreshing=false;
/* Standalone hosting (own domain / GitHub Pages): the same feeds come from data/feeds.json, written by the scheduled runs. */
const STANDALONE=!(window.claude&&typeof window.claude.use==='function');
async function fetchFeeds(){const r=await fetch('data/feeds.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const f=j.feeds||j;Object.keys(f).forEach(k=>{state.feeds[k]=f[k]});state.fromBackup=false;saveBackup()}
async function refresh(manual){if(refreshing)return;if(!state.db&&!STANDALONE)return;refreshing=true;$('#btnRefresh').classList.add('spin');try{if(state.db){const snap=await state.db.collection('feeds').get();if(!snap.empty){snap.docs.forEach(d=>{state.feeds[d.id]=d.data()});state.fromBackup=false;saveBackup()}}else await fetchFeeds();state.lastCheck=new Date();renderAll()}catch(e){console.warn('refresh failed',e)}finally{refreshing=false;$('#btnRefresh').classList.remove('spin')}}
async function connect(){setTimeout(()=>{if(!state.ready){state.ready=true;renderAll()}},12000);
 if(STANDALONE){try{await fetchFeeds();state.lastCheck=new Date()}catch(e){console.warn('feeds',e)}state.ready=true;renderAll();if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}return}
 const db=await window.claude?.use?.('db');if(!db){state.ready=true;state.lastCheck=new Date();renderAll();return}state.db=db;
 db.collection('feeds').onSnapshot(snap=>{let changed=false;state.ready=true;snap.docs.forEach(d=>{const v=d.data();if(state.feeds[d.id]!==v){state.feeds[d.id]=v;changed=true}});state.lastCheck=new Date();state.fromBackup=false;if(changed)saveBackup();renderAll()},err=>{console.warn('db',err);renderStatus()})}
/* ========== timers ========== */
let minuteTimer=null,pollTimer=null;
function startTimers(){stopTimers();minuteTimer=setInterval(()=>{renderDate();renderStrip();renderWatch();renderRadar();renderGadgets();renderEvents()},60000);pollTimer=setInterval(()=>refresh(false),300000)}
function stopTimers(){clearInterval(minuteTimer);clearInterval(pollTimer)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTimers();else{renderAll();refresh(false);startTimers()}});
addEventListener('online',()=>{renderAll();refresh(false)});addEventListener('offline',renderAll);
/* ========== boot ========== */
(function boot(){state.lang=ls.get('dd.lang')||'ar';state.size=ls.get('dd.size')||'large';state.theme=ls.get('dd.theme')||'';state.gadgetTab=ls.get('dd.tab')||'month';
 const h=location.hash.replace('#','');if(['gadgets','events','markets','stocks','watch'].includes(h))setTimeout(()=>{const m={gadgets:'#secGadgets',events:'#secEvents',markets:'#secDFM',stocks:'#secStocks',watch:'#secWatch'};$(m[h])?.scrollIntoView()},300);
 loadBackup();applyPrefs();renderAll();connect();startTimers()})();
</script>
